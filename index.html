<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AA Pin the Needle</title>
<meta name="description" content="AA Pin the Needle, a one-tap timing game by Canvider.">
<style>
:root { --ground:#ffffff; --text:#14161a; --dim:#4f5560; --line:#d9dce1; --link:#9a5b00; }
@media (prefers-color-scheme: dark) {
  :root { --ground:#0B0C0F; --text:#E6E8EC; --dim:#8A9099; --line:#23262D; --link:#FFB020; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--ground); color:var(--text);
       font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width:720px; margin:0 auto; padding:40px 20px 64px; }
h1 { font-size:1.75rem; line-height:1.25; margin:0 0 8px; }
h2 { font-size:1.2rem; margin:36px 0 8px; padding-top:20px; border-top:1px solid var(--line); }
p, li { color:var(--text); }
.updated { color:var(--dim); margin:0 0 24px; }
a { color:var(--link); }
ul { padding-left:22px; }
li { margin:4px 0; }
.table { overflow-x:auto; }
table { border-collapse:collapse; width:100%; margin:12px 0; font-size:0.95rem; }
th, td { text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--line); }
th { color:var(--dim); font-weight:600; }
</style>
</head>
<body>
<main>
<h1>AA Pin the Needle</h1>
<p class="updated">A one-tap timing game by Canvider.</p>
<ul>
  <li><a href="privacy.html">Privacy Policy</a></li>
  <li>Contact: <a href="mailto:info@canvider.com">info@canvider.com</a></li>
</ul>
</main>
</body>
</html>
